%22%231F3547%22/%3E%3Ccircle cx=%2214%22 cy=%2296%22 r=%221.8%22 fill=%22%231F3547%22/%3E%3Ccircle cx=%2270%22 cy=%22150%22 r=%222%22 fill=%22%231F3547%22/%3E%3Ccircle cx=%22140%22 cy=%22150%22 r=%221.6%22 fill=%22%231F3547%22/%3E%3Ccircle cx=%22236%22 cy=%22160%22 r=%222%22 fill=%22%231F3547%22/%3E%3Ccircle cx=%22100%22 cy=%22190%22 r=%221.8%22 fill=%22%231F3547%22/%3E%3Ccircle cx=%22180%22 cy=%22222%22 r=%222%22 fill=%22%231F3547%22/%3E%3Ccircle cx=%2216%22 cy=%22226%22 r=%221.6%22 fill=%22%231F3547%22/%3E%3Ccircle cx=%22226%22 cy=%22100%22 r=%221.5%22 fill=%22%231F3547%22/%3E%3Ccircle cx=%2250%22 cy=%2298%22 r=%221.4%22 fill=%22%231F3547%22/%3E%3C/svg%3E");
  --bg:#0D1618; --surface:#152225; --ink:#E6EFEC; --muted:#92A5A9; --line:#243538;
  --accent:#2DB894; --accent-ink:#06201A; --amber:#F0B64F; --amber-bg:#3A2D10;
  --danger:#F08070; --chip:#1D2E31; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);background-image:var(--snowtile);background-size:240px 240px;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.shell{max-width:480px;margin:0 auto;min-width:0}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 8px}
.logo{font-family:var(--display);font-weight:700;font-size:22px;white-space:nowrap;color:var(--brand) !important;letter-spacing:0;line-height:1}
.logo small{display:block;font-family:var(--font);font-size:11px;font-weight:500;color:var(--muted);margin-top:4px}
.govpick{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-width:0}
.govpick select{background:transparent;border:0;outline:0;max-width:120px;font-weight:600;cursor:pointer;color:var(--ink)}
.govpick svg{width:18px;height:18px;color:var(--accent)}
.pagehead{display:flex;align-items:center;gap:10px;padding:12px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.pagehead h1{font-size:19px;margin:0;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* search + chips */
.search{position:relative;margin:4px 0 12px}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.search input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding-inline:44px 14px;outline:0}
.search input:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;white-space:nowrap}
.chip svg{width:18px;height:18px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sortrow{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;margin-bottom:10px}
.sortrow select{background:transparent;border:0;color:var(--ink);font-weight:600;outline:0}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;text-align:start;padding:0;cursor:pointer;position:relative}
.art{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;background:color-mix(in srgb,var(--t) 16%,var(--surface));color:var(--t);overflow:hidden}
.art svg{width:46%;height:46%;stroke-width:1.4}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.price{font-weight:700;font-size:16px;color:var(--amber);font-variant-numeric:tabular-nums}
.price small{font-weight:500;font-size:12px;margin-inline-start:3px}
.card .t{font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:3em;line-height:1.5}
.meta{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;min-width:0}
.meta svg{width:14px;height:14px}
.meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav{position:absolute;top:8px;inset-inline-start:8px;width:34px;height:34px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 88%,transparent);display:grid;place-items:center;color:var(--ink)}
.fav svg{width:18px;height:18px}
.fav.on{color:var(--danger)}
.fav.on svg{fill:currentColor}
.sold{position:absolute;top:8px;inset-inline-end:8px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:44px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:40px;height:40px;opacity:.6}

/* buttons + forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn{text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.block{width:100%}
.btn.sm{height:38px;padding:0 14px;border-radius:10px;font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field label{font-weight:600;font-size:14px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;outline:0;min-height:48px}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--danger);font-size:13px;min-height:1.4em;margin:-4px 0 8px}
.hint{color:var(--muted);font-size:13px}
.phonebox{display:flex;direction:ltr;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.phonebox:focus-within{border-color:var(--accent)}
.phonebox span{display:grid;place-items:center;padding:0 14px;background:var(--chip);font-weight:600;font-variant-numeric:tabular-nums}
.phonebox input{border:0;flex:1;min-width:0;padding:12px 14px;outline:0;background:transparent;font-size:18px;letter-spacing:1px;font-variant-numeric:tabular-nums}

/* auth */
.auth{padding-top:48px;display:flex;flex-direction:column;gap:22px}
.auth .logo{font-size:38px}
.auth h1{font-size:22px;margin:0;line-height:1.4}
.auth p{margin:0;color:var(--muted)}
.otp{direction:ltr;text-align:center;letter-spacing:14px;font-size:28px !important;font-weight:700}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pwbox{position:relative;direction:ltr}
.pwbox input{padding-right:78px}
.pwbox .eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:8px}
.field .hint{margin-top:-2px}

/* photos */
.photos{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.ph{flex:none;width:84px;height:84px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);background:var(--surface);position:relative;overflow:hidden;font-size:11px}
.ph.add{cursor:pointer;flex-direction:column;gap:2px}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:4px;inset-inline-end:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.ph button svg{width:12px;height:12px}

/* detail */
.hero{border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.hero .art{aspect-ratio:4/3;position:relative}
.hero .art img.bg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(18px) brightness(.92);transform:scale(1.05)}
.hero .art img.fg{position:relative;width:100%;height:100%;object-fit:contain}
.hero .art svg{width:30%;height:30%}
.gal{display:flex;gap:8px;overflow-x:auto;margin-top:8px}
.gal img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer}
.gal img.on{border-color:var(--accent)}
.dprice{font-size:26px;font-weight:700;color:var(--amber);margin:14px 0 2px;font-variant-numeric:tabular-nums}
.dtitle{font-size:19px;font-weight:600;margin:0 0 10px;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tag{background:var(--chip);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.tag.warn{background:var(--amber-bg);color:var(--amber)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.panel h2{font-size:15px;margin:0 0 8px}
.panel p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.seller{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
button.avatar{border:0;padding:0;cursor:pointer}
.avatar .cam{position:absolute;inset:auto 0 0 0;height:30%;background:rgba(0,0,0,.45);display:grid;place-items:center}
.avatar .cam svg{width:14px;height:14px;color:#fff}
.phoneshow{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chip);border-radius:12px;padding:10px 14px}
.phoneshow b{direction:ltr;unicode-bidi:isolate;font-size:17px;font-variant-numeric:tabular-nums;user-select:all}
.safe{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.safe li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.safe svg{width:18px;height:18px;color:var(--accent);margin-top:3px}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.hero{position:relative}
.auth .logo,.topbar .logo{position:relative;z-index:0}
.auth .logo::before,.topbar .logo::before{content:'';position:absolute;z-index:-1;top:-8px;bottom:-8px;left:-16px;right:-16px;border-radius:18px;background:var(--snowlogo) center/cover no-repeat,radial-gradient(ellipse at center,var(--glow),transparent 72%)}
.topbar .logo::before{top:-4px;bottom:-4px;left:-10px;right:-10px}
.brand{position:relative;display:inline-block;padding-top:.3em}
.brand .flake{position:absolute;right:30%;top:-.02em;width:.6em;height:.6em}
.brand .snowman{display:inline-block;width:.78em;height:1.02em;vertical-align:-.2em;margin-inline-start:.18em}
.brand .hat{position:absolute;left:-.42em;top:-.12em;width:1em;height:.85em;transform:rotate(-14deg)}
.zoombtn{position:absolute;left:10px;bottom:10px;width:40px;height:40px;border-radius:12px;border:0;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:2}
.zoombtn svg{width:20px;height:20px}
.viewer{position:fixed;inset:0;z-index:210;background:#000;color:#fff}

function openViewer(photos,start){
  var i=start||0, z=1, tx=0, ty=0;
  var ov=document.createElement('div'); ov.className='viewer'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-label','عرض الصورة');
  ov.innerHTML='<div class="vstage"><img alt=""></div><button type="button" class="vclose" data-v="close" aria-label="إغلاق">'+ic('x')+'</button>'
    +(photos.length>1?'<div class="vcount"></div><button type="button" class="vnav vprev" data-v="prev" aria-label="السابقة">'+ic('back')+'</button><button type="button" class="vnav vnext" data-v="next" aria-label="التالية">'+ic('back')+'</button>':'');
  document.body.appendChild(ov);
  var prevOv=document.body.style.overflow; document.body.style.overflow='hidden';
  var st=ov.querySelector('.vstage'), img=st.querySelector('img'), cnt=ov.querySelector('.vcount');
  function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
  function apply(){
    var mx=(z-1)*st.clientWidth/2, my=(z-1)*st.clientHeight/2;
    tx=clamp(tx,-mx,mx); ty=clamp(ty,-my,my);
    img.style.transform='translate('+tx+'px,'+ty+'px) scale('+z+')';
  }
  function show(n){
    i=(n+photos.length)%photos.length; z=1; tx=0; ty=0;
    img.src=photos[i]; if(cnt) cnt.textContent=(i+1)+' / '+photos.length; apply();
  }
  var pts={}, last=0, sx=0, moved=false, lastTap=0;
  st.addEventListener('pointerdown',function(e){
    try{st.setPointerCapture(e.pointerId);}catch(x){}
    pts[e.pointerId]={x:e.clientX,y:e.clientY}; last=0;
    if(Object.keys(pts).length===1){ sx=e.clientX; moved=false; }
  });
  st.addEventListener('pointermove',function(e){
    var p=pts[e.pointerId]; if(!p) return;
    var ids=Object.keys(pts);
    if(ids.length===1){
      if(Math.abs(e.clientX-sx)>8) moved=true;
      if(z>1){ tx+=e.clientX-p.x; ty+=e.clientY-p.y; apply(); }
      p.x=e.clientX; p.y=e.clientY;
    } else {
      moved=true; p.x=e.clientX; p.y=e.clientY;
      var a=pts[ids[0]], b=pts[ids[1]], d=Math.hypot(a.x-b.x,a.y-b.y);
      if(last){ z=clamp(z*d/last,1,5); if(z===1){tx=0;ty=0;} apply(); }
      last=d;
    }
  });
  function up(e){
    var p=pts[e.pointerId]; if(!p) return;
    var single=Object.keys(pts).length===1;
    delete pts[e.pointerId]; last=0;
    if(!single) return;
    var dx=e.clientX-sx;
    if(z===1 && photos.length>1 && Math.abs(dx)>60){ show(dx<0?i+1:i-1); return; }
    if(!moved){
      var now=Date.now();
      if(now-lastTap<300){ z=(z>1?1:2.5); tx=0; ty=0; apply(); lastTap=0; } else lastTap=now;
    }
  }
  st.addEventListener('pointerup',up); st.addEventListener('pointercancel',function(e){delete pts[e.pointerId];last=0;});
  st.addEventListener('wheel',function(e){ e.preventDefault(); z=clamp(z*(e.deltaY<0?1.15:0.87),1,5); if(z===1){tx=0;ty=0;} apply(); },{passive:false});
  function close(){ document.removeEventListener('keydown',key); document.body.style.overflow=prevOv; ov.remove(); }
  function key(e){ if(e.key==='Escape') close(); }
  document.addEventListener('keydown',key);
  ov.addEventListener('click',function(e){
    var b=e.target.closest('[data-v]'); if(!b) return;
    var v=b.getAttribute('data-v');
    if(v==='close') close(); else if(v==='next') show(i+1); else if(v==='prev') show(i-1);
  });
  show(i);
}

function openCropper(im,idx,total,only){
  return new Promise(function(done){
    var SH={sq:{n:'مربع',r:1},wide:{n:'أفقي',r:4/3},tall:{n:'طولي',r:3/4},full:{n:'الأصلية',r:0}};
    var keys=only||['sq','wide','tall','full'];
    var mode=keys[0], iw=im.naturalWidth, ih=im.naturalHeight, fw=0, fh=0, base=1, z=1, tx=0, ty=0;
    var ov=document.createElement('div'); ov.className='crop'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-label','قص الصورة');
    ov.innerHTML='<div class="bar">حرّك الصورة وكبّرها لتختار الجزء الظاهر'+(total>1?' ('+idx+' من '+total+')':'')+'</div>'
      +'<div class="stagewrap"><div class="frame"><img alt=""></div></div>'
      +'<div class="tools">'+(keys.length>1?'<div class="shapes"></div>':'')+'<input type="range" min="100" max="400" value="100" aria-label="تكبير الصورة"><div class="acts2"><button type="button" data-k="skip">'+(total>1?'تخطي':'إلغاء')+'</button><button type="button" class="ok" data-k="ok">تم</button></div></div>';
    document.body.appendChild(ov);
    var prevOv=document.body.style.overflow; document.body.style.overflow='hidden';
    var wrap=ov.querySelector('.stagewrap'), fr=ov.querySelector('.frame'), ci=fr.querySelector('img'), cz=ov.querySelector('input'), sh=ov.querySelector('.shapes');
    ci.src=im.src; ci.style.width=iw+'px'; ci.style.height=ih+'px';
    function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
    function apply(){
      var s=base*z;
      tx=clamp(tx,fw-iw*s,0); ty=clamp(ty,fh-ih*s,0);
      ci.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')';
      cz.value=Math.round(z*100);
    }
    function layout(){
      var r=SH[mode].r||iw/ih;
      var aw=wrap.clientWidth-20, ah=wrap.clientHeight-20;
      var w=Math.min(aw,ah*r), h=w/r;
      fw=Math.round(w); fh=Math.round(h);
      fr.style.width=fw+'px'; fr.style.height=fh+'px';
      base=Math.max(fw/iw,fh/ih); z=1;
      tx=(fw-iw*base)/2; ty=(fh-ih*base)/2;
      cz.disabled=(mode==='full');
      if(sh) Array.prototype.forEach.call(sh.children,function(b){b.className=(b.getAttribute('data-m')===mode?'on':'');});
      apply();
    }
    if(sh) sh.innerHTML=keys.map(function(k){return '<button type="button" data-m="'+k+'">'+SH[k].n+'</button>';}).join('');
    function zoomAt(mx,my,nz){
      var s=base*z, ix=(mx-tx)/s, iy=(my-ty)/s;
      z=clamp(nz,1,4); var s2=base*z;
      tx=mx-ix*s2; ty=my-iy*s2; apply();
    }
    var pts={}, last=0;
    fr.addEventListener('pointerdown',function(e){ if(mode==='full') return; try{fr.setPointerCapture(e.pointerId);}catch(x){} pts[e.pointerId]={x:e.clientX,y:e.clientY}; last=0; });
    fr.addEventListener('pointermove',function(e){
      var p=pts[e.pointerId]; if(!p) return;
      var ids=Object.keys(pts);
      if(ids.length===1){ tx+=e.clientX-p.x; ty+=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY; apply(); }
      else{
        p.x=e.clientX; p.y=e.clientY;
        var a=pts[ids[0]], b=pts[ids[1]], d=Math.hypot(a.x-b.x,a.y-b.y);
        if(last){ var rc=fr.getBoundingClientRect(); zoomAt((a.x+b.x)/2-rc.left,(a.y+b.y)/2-rc.top,z*d/last); }
        last=d;
      }
    });
    function up(e){ delete pts[e.pointerId]; last=0; }
    fr.addEventListener('pointerup',up); fr.addEventListener('pointercancel',up);
    fr.addEventListener('wheel',function(e){ if(mode==='full') return; e.preventDefault(); var rc=fr.getBoundingClientRect(); zoomAt(e.clientX-rc.left,e.clientY-rc.top,z*(e.deltaY<0?1.1:0.9)); },{passive:false});
    cz.addEventListener('input',function(){ zoomAt(fw/2,fh/2,cz.value/100); });
    function close(result){
      document.body.style.overflow=prevOv; ov.remove(); URL.revokeObjectURL(im.src); done(result);
    }
    ov.addEventListener('click',function(e){
      var m=e.target.closest('[data-m]'); if(m){ mode=m.getAttribute('data-m'); layout(); return; }
      var k=e.target.closest('[data-k]'); if(!k) return;
      if(k.getAttribute('data-k')==='skip'){ close(null); return; }
      var s=base*z, sx, sy, sw, shh;
      if(mode==='full'){ sx=0; sy=0; sw=iw; shh=ih; }
      else { sx=-tx/s; sy=-ty/s; sw=fw/s; shh=fh/s; }
      var sc=Math.min(1,1000/Math.max(sw,shh));
      var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(sw*sc)); c.height=Math.max(1,Math.round(shh*sc));
      c.getContext('2d').drawImage(im,sx,sy,sw,shh,0,0,c.width,c.height);
      c.toBlob(function(b){ close(b?{blob:b,url:URL.createObjectURL(b)}:null); },'image/jpeg',.82);
    });
    layout();
    ov.querySelector('.ok').focus();
  });
}
function readPhoto(file){
  return new Promise(function(res){
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var m=1000,r=Math.min(1,m/Math.max(im.width,im.height));
        var c=document.createElement('canvas'); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        c.toBlob(function(b){res(b?{blob:b,url:URL.createObjectURL(b)}:null);},'image/jpeg',.78);
      };
      im.onerror=function(){res(null);};
      im.src=fr.result;
    };
    fr.onerror=function(){res(null);};
    fr.readAsDataURL(file);
  });
}

async function loadConvs(){
  var r=await sb.from('conversations')
    .select('id,listing_id,buyer_id,seller_id,created_at,listing:listings(id,title,category,photos,price,governorate),buyer:profiles!buyer_id(username),seller:profiles!seller_id(username)');
  if(r.error) throw r.error;
  var rows=r.data||[], ids=rows.map(function(c){return c.id;});
  var last={};
  if(ids.length){
    var m=await sb.from('messages').select('conversation_id,body,created_at').in('conversation_id',ids).order('created_at',{ascending:false}).limit(400);
    if(m.error) throw m.error;
    m.data.forEach(function(x){if(!last[x.conversation_id]) last[x.conversation_id]=x;});
  }
  S.convs=rows.filter(function(c){return last[c.id]&&c.listing;}).map(function(c){
    var iAmBuyer=c.buyer_id===S.user.id;
    return {id:c.id,listing:{id:c.listing.id,title:c.listing.title,cat:c.listing.category,photos:(c.listing.photos||[]).filter(okPhoto),price:c.listing.price,gov:c.listing.governorate},
      other:iAmBuyer?(c.seller&&c.seller.username):(c.buyer&&c.buyer.username),last:last[c.id].body,ts:Date.parse(last[c.id].created_at)};
  }).sort(function(a,b){return b.ts-a.ts;});
}
function renderChats(){
  loadingView();
  loadConvs().then(function(){ if(S.view==='chats') drawChats(); })
   .catch(function(e){ if(S.view==='chats'){toast(netErr(e)); S.convs=[]; drawChats();} });
}
function drawChats(){
  mount('<div class="pagehead"><h1>المحادثات</h1></div><div class="list">'
   +(S.convs.length?S.convs.map(function(c){
      return '<button class="li" data-act="openconv" data-id="'+c.id+'">'+art(c.listing)+'<div class="mid"><b>@'+esc(c.other)+' · '+esc(c.listing.title)+'</b><span>'+esc(c.last)+'</span></div><span class="hint">'+clock(c.ts)+'</span></button>';
    }).join(''):'<div class="empty">'+ic('chat')+'<b>ماكو محادثات بعد</b><span>افتح أي إعلان واضغط «راسل البائع».</span></div>')+'</div>');
}
function msgHTML(m){var me=m.sender_id===S.user.id;return '<div class="msg '+(me?'me':'them')+'">'+esc(m.body)+'<time>'+clock(Date.parse(m.created_at))+'</time></div>';}
function drawThread(scroll){
  var th=$('#thread'); if(!th) return;
  th.innerHTML=S.msgs.length?S.msgs.map(msgHTML).join(''):'<div class="hint" style="text-align:center">ابدأ المحادثة، مثلاً: السلام عليكم، الغرض لسه متوفر؟</div>';
  if(scroll) window.scrollTo(0,document.body.scrollHeight);
}
async function fetchMsgs(){
  if(!S.chat||!S.chat.convId) return false;
  var r=await sb.from('messages').select('id,sender_id,body,created_at').eq('conversation_id',S.chat.convId).order('created_at',{ascending:true}).limit(500);
  if(r.error) throw r.error;
  var changed=r.data.length!==S.msgs.length;
  S.msgs=r.data; return changed;
}
function renderChat(){
  var ch=S.chat; if(!ch) return go('chats');
  var l=ch.listing;
  mount('<div class="pagehead"><button class="iconbtn" data-act="back" aria-label="رجوع">'+ic('back')+'</button><h1>@'+esc(ch.other)+'</h1></div>'
   +'<button class="li" data-act="open" data-id="'+esc(l.id)+'">'+art(l)+'<div class="mid"><b>'+esc(l.title)+'</b><span>'+money(l.price)+' د.ع · '+esc(l.gov)+'</span></div></button>'
   +'<div class="thread" id="thread" style="margin-top:12px"></div>');
  drawThread(false);
  if(ch.convId){
    fetchMsgs().then(function(){ if(S.view==='chat') drawThread(true); }).catch(function(e){toast(netErr(e));});
    stopPoll();
    pollT=setInterval(function(){
      if(S.view!=='chat'){stopPoll();return;}
      fetchMsgs().then(function(ch2){if(ch2&&S.view==='chat') drawThread(true);}).catch(function(){});
    },3500);
  }
}
async function openChatForListing(id){
  var l=getL(id); if(!l) return;
  var r=await sb.from('conversations').select('id').eq('listing_id',id).eq('buyer_id',S.user.id).maybeSingle();
  S.msgs=[];
  S.chat={convId:(r.data&&r.data.id)||null,listing:l,other:l.seller};
  S.from='detail'; go('chat');
}
async function sendMsg(txt){
  if(!S.chat.convId){
    var l=S.chat.listing;
    var c=await sb.from('conversations').insert({listing_id:l.id,buyer_id:S.user.id,seller_id:l.owner}).select('id').single();
    if(c.error){
      if(c.error.code==='23505'){
        var ex=await sb.from('conversations').select('id').eq('listing_id',l.id).eq('buyer_id',S.user.id).single();
        if(ex.error) throw ex.error; S.chat.convId=ex.data.id;
      } else throw c.error;
    } else S.chat.convId=c.data.id;
  }
  var m=await sb.from('messages').insert({conversation_id:S.chat.convId,sender_id:S.user.id,body:txt}).select('id,sender_id,body,created_at').single();
  if(m.error) throw m.error;
  S.msgs.push(m.data); drawThread(true);
  if(!pollT){pollT=setInterval(function(){
    if(S.view!=='chat'){stopPoll();return;}
    fetchMsgs().then(function(ch2){if(ch2&&S.view==='chat') drawThread(true);}).catch(function(){});
  },3500);}
}

var REASONS={scam:'احتيال أو نصب',prohibited:'غرض ممنوع أو مخالف',fake:'سعر أو صور غير حقيقية',dup:'إعلان مكرر',other:'سبب آخر'};
async function loadReports(){
  var r=await sb.from('reports').select('listing_id,listing_title,reason,note,created_at').order('created_at',{ascending:false}).limit(300);
  if(r.error) throw r.error;
  var g={},order=[];
  r.data.forEach(function(x){
    if(!g[x.listing_id]){g[x.listing_id]={id:x.listing_id,title:x.listing_title||'—',n:0,reasons:{},notes:[]};order.push(x.listing_id);}
    var o=g[x.listing_id]; o.n++; o.reasons[x.reason]=1; if(x.note&&o.notes.length<3) o.notes.push(x.note);
  });
  S.reports=order.map(function(k){return g[k];});
}
function renderAdmin(){
  if(!S.user||!S.user.admin) return go('profile');
  loadingView();
  loadReports().then(function(){ if(S.view==='admin') drawAdmin(); })
   .catch(function(e){ if(S.view==='admin'){toast(netErr(e)); S.reports=[]; drawAdmin();} });

document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var a=el.getAttribute('data-act'), id=el.getAttribute('data-id');
  if(a==='fav'){
    e.stopPropagation();
    var on=!!S.favs[id];
    if(on) delete S.favs[id]; else S.favs[id]=1;
    rerenderCurrent();
    var fr=on?await sb.from('favorites').delete().eq('user_id',S.user.id).eq('listing_id',id)
             :await sb.from('favorites').insert({user_id:S.user.id,listing_id:id});
    if(fr.error){ if(on) S.favs[id]=1; else delete S.favs[id]; rerenderCurrent(); toast(netErr(fr.error)); }
    return;
  }
  try{
  switch(a){
    case 'open': if(S.view!=='detail'&&S.view!=='chat') S.from=S.view; S.detail=id; S.imgIdx=0; S.confirmDel=null; S.reportOpen=null; go('detail');
      var lv=getL(id);
      if(lv&&!lv.mine&&!S.viewed[id]){ S.viewed[id]=1; sb.rpc('record_view',{lid:id}).then(function(){},function(){}); }
      break;
    case 'back':
      if(S.view==='chat') go(S.from==='chats'?'chats':'detail');
      else go(S.from&&S.from!=='detail'&&S.from!=='chat'?S.from:'home');
      break;
    case 'tab': if(S.view!=='add'||S.editId) S.photos=[]; S.editId=null; go(el.getAttribute('data-v')); break;
    case 'zoomimg': var lz=getL(S.detail); if(lz&&lz.photos.length) openViewer(lz.photos,S.imgIdx||0); break;
    case 'editad':
      var le=getL(id); if(!le) break;
      S.editId=id; S.photos=le.photos.map(function(u){return {url:u,old:true};}); go('add'); break;
    case 'canceledit': S.photos=[]; S.editId=null; go('detail'); break;
    case 'goadd': go('add'); break;
    case 'cat': S.cat=el.getAttribute('data-id'); $('#chips').innerHTML=chipsHTML(); renderGrid(); break;
    case 'refresh': el.disabled=true; await refresh(); renderGrid(); el.disabled=false; toast('تم التحديث'); break;
    case 'authtab': S.step=el.getAttribute('data-v'); render(); break;
    case 'togglepw':
      S.pw=!S.pw;
      Array.prototype.forEach.call(document.querySelectorAll('.pwbox input'),function(i){i.type=S.pw?'text':'password';});
      Array.prototype.forEach.call(document.querySelectorAll('.pwbox .eye'),function(b){b.textContent=S.pw?'إخفاء':'إظهار';});
      break;
    case 'phone': S.showPhone[id]=true; renderDetail(); break;
    case 'img': S.imgIdx=+el.getAttribute('data-i'); renderDetail(); break;
    case 'copy':
      var v=el.getAttribute('data-v');
      try{ navigator.clipboard.writeText(v).then(function(){toast('تم نسخ الرقم');},function(){toast('الرقم: '+v);}); }catch(x){toast('الرقم: '+v);}
      break;
    case 'openchat': await openChatForListing(id); break;
    case 'openconv':
      var c=S.convs.filter(function(x){return x.id===id;})[0]; if(!c) break;
      S.msgs=[]; S.chat={convId:c.id,listing:c.listing,other:c.other}; S.from='chats'; go('chat'); break;
    case 'pick': $('#file').click(); break;
    case 'pickav': $('#fileav').click(); break;
    case 'shareapp':
      var su=location.origin+location.pathname.replace(/index\.html$/,'');
      var sd={title:'Iraq Shopping',text:'Iraq Shopping: بيع واشتري بين العراقيين',url:su};
      if(navigator.share){ try{ await navigator.share(sd); }catch(x){} }
      else { try{ await navigator.clipboard.writeText(su); toast('تم نسخ رابط التطبيق'); }catch(x){ toast(su); } }
      break;
    case 'admin': go('admin'); break;
    case 'adel': S.adminConfirm=id; drawAdmin(); break;
    case 'adelno': S.adminConfirm=null; drawAdmin(); break;
    case 'adel2':
      el.disabled=true;
      var ad=await sb.from('listings').delete().eq('id',id).select('id');
      if(ad.error) throw ad.error;
      if(!ad.data||!ad.data.length) throw new Error('ما عندك صلاحية حذف هذا الإعلان');
      await sb.from('reports').delete().eq('listing_id',id);
      S.listings=S.listings.filter(function(x){return x.id!==id;}); S.adminConfirm=null;
      await loadReports(); drawAdmin(); toast('تم حذف الإعلان'); break;
    case 'adismiss':
      el.disabled=true;
      var ds=await sb.from('reports').delete().eq('listing_id',id).select('listing_id');
      if(ds.error) throw ds.error;
      await loadReports(); drawAdmin(); toast('تم تجاهل البلاغات'); break;
    case 'report': S.reportOpen=id; renderDetail(); break;
    case 'reportno': S.reportOpen=null; renderDetail(); break;
    case 'report2':
      var rl=getL(id); el.disabled=true;
      var rr=await sb.from('reports').insert({listing_id:String(id),listing_title:rl?rl.title:'',reporter_id:S.user.id,reason:$('#rreason').value,note:$('#rnote').value.trim()});
      if(rr.error && rr.error.code!=='23505') throw rr.error;
      S.reported[id]=true; S.reportOpen=null; renderDetail(); toast('وصل بلاغك، شكراً لك'); break;
    case 'rmph': S.photos.splice(+el.getAttribute('data-i'),1); renderPhotos(); break;
    case 'sold':
      var l=getL(id); if(!l) break;
      var u=await sb.from('listings').update({sold:!l.sold}).eq('id',id);
      if(u.error) throw u.error;
      l.sold=!l.sold; renderDetail(); toast(l.sold?'تم تعليم الإعلان كمباع':'رجع الإعلان للبيع'); break;
    case 'del': S.confirmDel=id; renderDetail(); break;
    case 'delno': S.confirmDel=null; renderDetail(); break;
    case 'del2':
      var dl=getL(id); el.disabled=true;
      var d=await sb.from('listings').delete().eq('id',id);
      if(d.error) throw d.error;
      if(dl&&dl.photos.length){
        var paths=dl.photos.map(function(u){return decodeURIComponent((u.split('/listing-photos/')[1]||'').split('?')[0]);}).filter(Boolean);
        if(paths.length) sb.storage.from('listing-photos').remove(paths).catch(function(){});
      }
      S.listings=S.listings.filter(function(x){return x.id!==id;}); delete S.favs[id]; S.confirmDel=null;
      toast('تم حذف الإعلان'); go('profile'); break;
    case 'logout':
      await sb.auth.signOut();
      S.user=null; S.favs={}; S.listings=[]; S.convs=[]; S.step='login'; S.view='home'; render(); break;
  }
  }catch(err){ toast(netErr(err)); if(el) el.disabled=false; }
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('card')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;renderGrid();}
  if(e.target.id==='rph'){e.target.value=e.target.value.replace(/[^0-9\s]/g,'');}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='gov'){S.gov=t.value;renderGrid();}
  if(t.id==='sort'){S.sort=t.value;renderGrid();}
  if(t.id==='fileav'){
    var f0=t.files&&t.files[0]; if(!f0) return;
    toast('جاري رفع الصورة...');
    loadImg(f0).then(function(im){
      if(!im){ toast('تعذّر قراءة الصورة، جرب صورة ثانية.'); return null; }
      return openCropper(im,1,1,['sq']);
    }).then(async function(ph){
      if(!ph){ t.value=''; return; }
      try{
        var url=await uploadPhoto(ph.blob);
        var up=await sb.from('profiles').update({avatar_url:url}).eq('id',S.user.id);
        if(up.error) throw up.error;
        S.user.avatar=url; await refresh();
        if(S.view==='profile') renderProfile();
        toast('تم تغيير صورتك');
      }catch(er){toast(netErr(er));}
      t.value='';
    });
  }
  if(t.id==='file'){
    var files=Array.prototype.slice.call(t.files).slice(0,4-S.photos.length);
    t.value='';
    (async function(){
      for(var i=0;i<files.length;i++){
        var im=await loadImg(files[i]);
        if(!im){ toast('تعذّر قراءة الصورة، جرب صورة ثانية.'); continue; }
        var out=await openCropper(im,i+1,files.length);
        if(out && S.photos.length<4) S.photos.push(out);
      }
      renderPhotos();
    })();
  }
});
document.addEventListener('submit',async function(e){
  e.preventDefault();
  var f=e.target.id, err=$('#err'), btn=e.target.querySelector('button[type="submit"]');
  function busy(b,txt){ if(btn){btn.disabled=b; if(txt) btn.textContent=txt;} }
  try{
    if(f==='fLogin'){
      var un=$('#un').value.trim().toLowerCase(), pw=$('#pw').value;
      if(!un||!pw){err.textContent='اكتب اسم المستخدم وكلمة السر.';return;}
      busy(true,'جاري الدخول...');
      var r=await sb.auth.signInWithPassword({email:un+'@'+EMAIL_DOMAIN,password:pw});
      if(r.error){
        busy(false,'دخول');
        err.textContent=/invalid login/i.test(r.error.message)?'اسم المستخدم أو كلمة السر غلط.':netErr(r.error);
        return;
      }
      await startSession(r.data.user); toast('أهلاً بيك');
    } else if(f==='fReg'){
      var u2=$('#un').value.trim().toLowerCase(), p1=$('#pw').value, p2=$('#pw2').value;
      var d=$('#rph').value.replace(/\D/g,'');
      if(d.indexOf('964')===0) d=d.slice(3);
      if(d.charAt(0)==='0') d=d.slice(1);
      if(!/^[a-z0-9_]{3,20}$/.test(u2)){err.textContent='اسم المستخدم لازم يكون 3 إلى 20 حرف إنجليزي أو رقم أو _';return;}
      if(p1.length<6){err.textContent='كلمة السر لازم تكون 6 أحرف أو أكثر.';return;}
      if(p1!==p2){err.textContent='كلمتا السر مو متطابقتين.';return;}
      if(!/^7\d{9}$/.test(d)){err.textContent='اكتب رقم عراقي صحيح، مثل 770 123 4567';return;}
      busy(true,'جاري إنشاء الحساب...');
      var s=await sb.auth.signUp({email:u2+'@'+EMAIL_DOMAIN,password:p1,options:{data:{username:u2,phone:d}}});
      if(s.error){
        busy(false,'إنشاء الحساب');
        var m=s.error.message||'';
        if(/already registered/i.test(m)) err.textContent='اسم المستخدم مأخوذ، اختر اسم ثاني.';
        else if(/database error/i.test(m)) err.textContent='الاسم أو رقم الموبايل مستخدم بحساب ثاني.';
        else err.textContent='تعذّر إنشاء الحساب: '+m;
        return;
      }
      if(!s.data.session){busy(false,'إنشاء الحساب'); err.textContent='الحساب انعمل لكن تأكيد الإيميل شغال بالإعدادات. أطفئه من Supabase.';return;}
      await startSession(s.data.user); toast('تم إنشاء حسابك، أهلاً بيك');
    } else if(f==='fAdd'){
      var title=$('#title').value.trim(), price=$('#price').value.replace(/[^\d]/g,''), gov=$('#gov2').value;
      if(!S.user.phone){err.textContent='لازم يكون عندك رقم موبايل بحسابك حتى تنشر إعلان.';return;}
      if(title.length<3){err.textContent='اكتب عنوان واضح للإعلان.';return;}
      if(!price||+price<=0){err.textContent='اكتب السعر بالدينار.';return;}
      if(!gov){err.textContent='اختر المحافظة.';return;}
      if(S.editId){
        var l0=getL(S.editId), eid=S.editId;
        busy(true,'جاري الحفظ...');
        var keep=[];
        for(var j=0;j<S.photos.length;j++){ keep.push(S.photos[j].blob?await uploadPhoto(S.photos[j].blob):S.photos[j].url); }
        var upd=await sb.from('listings').update({title:title,category:$('#cat').value,condition:$('#cond').value,price:+price,governorate:gov,description:$('#desc').value.trim(),photos:keep}).eq('id',eid).select('id');
        if(upd.error){busy(false,'حفظ التعديلات'); err.textContent=netErr(upd.error); return;}
        if(!upd.data||!upd.data.length){busy(false,'حفظ التعديلات'); err.textContent='ما عندك صلاحية تعديل هذا الإعلان.'; return;}
        if(l0){
          var gone=l0.photos.filter(function(u){return keep.indexOf(u)<0;}).map(function(u){return decodeURIComponent((u.split('/listing-photos/')[1]||'').split('?')[0]);}).filter(Boolean);
          if(gone.length){ try{ await sb.storage.from('listing-photos').remove(gone); }catch(x){} }
        }
        S.photos=[]; S.editId=null;
        loadingView('جاري الحفظ...');
        await refresh(); S.detail=eid; S.view='detail'; render(); toast('تم حفظ التعديلات');
        return;
      }
      busy(true,'جاري النشر...');
      var urls=[];
      for(var i=0;i<S.photos.length;i++){ urls.push(await uploadPhoto(S.photos[i].blob)); }
      var ins=await sb.from('listings').insert({owner:S.user.id,title:title,category:$('#cat').value,condition:$('#cond').value,price:+price,governorate:gov,description:$('#desc').value.trim(),photos:urls});
      if(ins.error){busy(false,'نشر الإعلان'); err.textContent=netErr(ins.error); return;}
      S.photos=[]; S.cat=''; S.q='';
      loadingView('جاري النشر...');
      await refresh(); S.view='home'; render(); toast('تم نشر إعلانك');
    } else if(f==='fChat'){
      var i2=$('#msg'), txt=i2.value.trim(); if(!txt) return;
      i2.value='';
      try{ await sendMsg(txt); }
      catch(er){ i2.value=txt; toast(netErr(er)); }
    }
  }catch(ex){
    busy(false);
    if(err) err.textContent=netErr(ex); else toast(netErr(ex));
  }
});

/* ---------- التشغيل ---------- */
async function boot(){
  if(!window.supabase){
    mount('<div class="empty" style="padding-top:120px"><b>تعذّر تحميل التطبيق</b><span>تأكد من الإنترنت وحدّث الصفحة.</span><button class="btn primary" onclick="location.reload()">تحديث</button></div>');
    return;
  }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  loadingView();
  try{
    var s=await sb.auth.getSession();
    if(s.data&&s.data.session) await startSession(s.data.session.user); else render();
  }catch(e){ render(); toast(netErr(e)); }
}
boot();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
